# ------------------------------------------------------------------------------------------
pediatric_antibiotics:   # the hearing topic; used for scoping questions like "pediatric antibiotic shortages"
  note: "Dataset has no pediatric flag. Oral suspensions/solutions are the pediatric-relevant presentations; this is a reasonable proxy, labeled as such."
  antibiotic_generic_names:
    - Amoxicillin
    - Amoxicillin-Clavulanate
    - Azithromycin
    - Cephalexin
    - Penicillin V Potassium
    - Clindamycin
    - Trimethoprim-Sulfamethoxazole
    - Ceftriaxone Sodium
    - Cefepime HCl
    - Vancomycin HCl
    - Piperacillin-Tazobactam
    - Ampicillin-Sulbactam
    - Meropenem
    - Aztreonam
  pediatric_presentation_proxy: ["Oral Suspension%", "Oral Solution%"]

# ------------------------------------------------------------------------------------------
data_quality_rules:   # run on load; warnings attach to any answer whose evidence touches flagged rows
  - id: DQ01_status_conflict
    severity: high
    desc: "shortage_id has rows with different shortage_status"
  - id: DQ02_orphan_application
    severity: medium
    desc: "shortage.related_application not found in applications"
  - id: DQ03_ingredient_mismatch
    severity: high
    desc: "shortage.generic_name != linked application.active_ingredient"
  - id: DQ04_fei_invalid_format
    severity: high
    desc: "FEI not 7 or 10 digits"
  - id: DQ05_fei_prefix_anomaly
    severity: medium
    desc: "FEI prefix differs from dataset majority pattern (3xxxxxxxxx)"
  - id: DQ06_fei_no_inspection
    severity: medium
    desc: "application.manufacturing_fei has no inspection record (country unknown)"
  - id: DQ07_fy_boundary_straddle
    severity: low
    desc: "inspection_end_date and classification_date fall in different fiscal years"
  - id: DQ08_stale_current
    severity: medium
    desc: "Current status last revised > stale_current_months before as_of"
  - id: DQ09_sponsor_operator_mismatch
    severity: info
    desc: "application.sponsor_name != inspections.firm_name for the FEI (contract manufacturing)"
  - id: DQ10_second_source_record
    severity: info
    desc: "shortage_id ends in 'B' — second-source record for same drug/presentation"
  - id: DQ11_shared_fei_multiple_sponsors
    severity: info
    desc: "one FEI appears under multiple sponsors"
  - id: DQ12_missing_dosage_form
    severity: medium
    desc: "applications has no dosage-form column; presentation-level application counts impossible"
  - id: DQ13_status_label_differs_from_fda
    severity: info
    desc: "dataset uses 'Discontinued'; FDA uses 'To Be Discontinued'/'Discontinuation'"
